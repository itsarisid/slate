<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alphabet — Education ERP Documentation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --void:#0a0d0a;
  --surface:#12160f;
  --surface-2:#171d13;
  --elevated:#1c231a;
  --border:#232c1e;
  --border-soft:#1a2117;
  --lime:#c3f53c;
  --lime-dim:#8fb02a;
  --lime-glow: rgba(195,245,60,0.14);
  --text:#eef1ea;
  --text-muted:#98a08c;
  --text-dim:#5d6455;
  --overlay-bg: rgba(6,8,6,0.7);
  --shadow-box: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(195,245,60,0.06);
  --shadow-sidebar: 20px 0 40px rgba(0,0,0,0.4);
  --radius:10px;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}

html[data-theme="light"]{
  --void:#f6f8f2;
  --surface:#ffffff;
  --surface-2:#eef2e7;
  --elevated:#e5eadb;
  --border:#dbe1d1;
  --border-soft:#e9ede1;
  --lime:#5b8a12;
  --lime-dim:#4a7010;
  --lime-glow: rgba(91,138,18,0.10);
  --text:#171b13;
  --text-muted:#5c6450;
  --text-dim:#8e9581;
  --overlay-bg: rgba(60,66,50,0.35);
  --shadow-box: 0 20px 60px rgba(60,70,40,0.15), 0 0 0 1px rgba(91,138,18,0.08);
  --shadow-sidebar: 20px 0 40px rgba(60,70,40,0.12);
}

body{ transition: background-color .2s ease, color .2s ease; }

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--void);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--lime); color:#0a0d0a; }

a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }

/* subtle background grid texture */
.bg-grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(var(--border-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);
  opacity:0.5;
}

/* ---------- App shell ---------- */
.app{
  position:relative; z-index:1;
  display:grid;
  grid-template-columns: 280px 1fr;
  min-height:100vh;
}

/* ---------- Sidebar ---------- */
.sidebar{
  border-right:1px solid var(--border);
  background: linear-gradient(180deg, var(--surface), var(--void) 85%);
  padding:20px 14px 24px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar::-webkit-scrollbar{ width:8px; }
.sidebar::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

.brand{
  display:flex; align-items:center; gap:10px;
  padding:6px 8px 18px;
  border-bottom:1px solid var(--border);
  margin-bottom:14px;
}
.brand-mark{
  width:30px; height:30px; border-radius:8px;
  background:var(--lime);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; color:#0a0d0a; font-size:15px;
  flex-shrink:0;
}
.brand-name{ font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:-0.01em; }
.brand-sub{ font-family:var(--font-mono); font-size:10px; color:var(--text-dim); letter-spacing:0.06em; text-transform:uppercase; }

.search-trigger{
  width:100%;
  display:flex; align-items:center; gap:8px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 10px;
  color:var(--text-dim);
  font-size:13px;
  margin-bottom:18px;
  transition:border-color .15s ease, background .15s ease;
}
.search-trigger:hover{ border-color:var(--lime-dim); background:var(--elevated); }
.search-trigger svg{ flex-shrink:0; opacity:0.7; }
.search-trigger .kbd{
  margin-left:auto;
  font-family:var(--font-mono);
  font-size:10px;
  background:var(--elevated);
  border:1px solid var(--border);
  padding:2px 5px;
  border-radius:4px;
  color:var(--text-dim);
}

.nav-home{
  display:flex; align-items:center; gap:8px;
  padding:8px 10px; border-radius:8px;
  font-size:13.5px; font-weight:500; color:var(--text-muted);
  margin-bottom:6px;
}
.nav-home:hover, .nav-home.active{ background:var(--surface-2); color:var(--text); }
.nav-home.active{ color:var(--lime); }

.nav-section{ margin-bottom:2px; }
.nav-cat-btn{
  width:100%;
  display:flex; align-items:center; gap:8px;
  background:transparent; border:none; color:var(--text-muted);
  padding:9px 10px; border-radius:8px;
  font-size:12.5px; font-weight:600;
  letter-spacing:0.02em;
  transition:color .15s ease, background .15s ease;
}
.nav-cat-btn:hover{ background:var(--surface-2); color:var(--text); }
.nav-cat-btn .cat-code{
  font-family:var(--font-mono); font-size:10px; font-weight:600;
  color:var(--lime-dim);
  background:var(--lime-glow);
  padding:1px 5px; border-radius:4px;
  flex-shrink:0;
}
.nav-cat-btn .cat-count{
  margin-left:auto; font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim);
}
.nav-cat-btn .chev{ transition:transform .18s ease; opacity:0.6; flex-shrink:0; }
.nav-section.open .chev{ transform:rotate(90deg); }

.nav-mods{
  overflow:hidden;
  max-height:0;
  transition:max-height .25s ease;
}
.nav-section.open .nav-mods{ max-height:900px; }

.nav-mod-link{
  display:flex; align-items:baseline; gap:8px;
  padding:6px 10px 6px 30px;
  font-size:13px; color:var(--text-muted);
  border-radius:6px;
  border-left:2px solid transparent;
  margin-left:8px;
}
.nav-mod-link .mod-id{
  font-family:var(--font-mono); font-size:10px; color:var(--text-dim); flex-shrink:0;
}
.nav-mod-link:hover{ color:var(--text); background:var(--surface-2); }
.nav-mod-link.active{
  color:var(--lime); background:var(--lime-glow);
  border-left-color:var(--lime);
}
.nav-mod-link.active .mod-id{ color:var(--lime-dim); }

/* ---------- Main content ---------- */
.main{ min-width:0; position:relative; }
.topbar{
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 40px;
  background:rgba(10,13,10,0.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.breadcrumb{ font-size:12.5px; color:var(--text-dim); font-family:var(--font-mono); }
.breadcrumb span.sep{ margin:0 6px; }
.breadcrumb span.current{ color:var(--text-muted); }
.topbar-actions{ display:flex; gap:10px; align-items:center; }
.stat-pill{
  font-family:var(--font-mono); font-size:11px; color:var(--text-dim);
  border:1px solid var(--border); padding:4px 9px; border-radius:20px;
}
.stat-pill b{ color:var(--lime); font-weight:600; }

.theme-toggle{
  display:flex; align-items:center; justify-content:center;
  width:32px; height:32px; border-radius:8px;
  border:1px solid var(--border); background:var(--surface);
  color:var(--text-muted);
  transition:border-color .15s ease, color .15s ease, background .15s ease;
}
.theme-toggle:hover{ border-color:var(--lime-dim); color:var(--lime); }
.theme-toggle .icon-moon{ display:none; }
html[data-theme="light"] .theme-toggle .icon-sun{ display:none; }
html[data-theme="light"] .theme-toggle .icon-moon{ display:block; }

.content{ padding:0 40px 100px; max-width:920px; }

/* ---------- Home / hero ---------- */
.hero{ padding:64px 0 40px; border-bottom:1px solid var(--border); margin-bottom:48px; }
.hero-eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:11.5px; color:var(--lime);
  border:1px solid var(--border); background:var(--lime-glow);
  padding:5px 12px; border-radius:20px; margin-bottom:24px;
}
.hero-eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--lime); box-shadow:0 0 8px var(--lime); }
.hero h1{
  font-family:var(--font-display); font-size:44px; line-height:1.12; letter-spacing:-0.02em;
  font-weight:700; max-width:680px; margin-bottom:18px;
}
.hero h1 em{ font-style:normal; color:var(--lime); }
.hero p.lead{ font-size:16px; color:var(--text-muted); max-width:600px; margin-bottom:36px; }

.hero-stats{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:1px;
  background:var(--border); border:1px solid var(--border); border-radius:12px; overflow:hidden;
  max-width:760px;
}
.hero-stat{ background:var(--surface); padding:20px 22px; }
.hero-stat .num{ font-family:var(--font-mono); font-size:26px; font-weight:600; color:var(--lime); }
.hero-stat .lbl{ font-size:12px; color:var(--text-dim); margin-top:4px; }

/* Category grid on home */
.section-label{
  font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em;
  color:var(--text-dim); margin-bottom:18px; display:flex; align-items:center; gap:10px;
}
.section-label::after{ content:''; flex:1; height:1px; background:var(--border); }

.cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:56px; }
.cat-card{
  border:1px solid var(--border); background:var(--surface);
  border-radius:12px; padding:22px;
  transition:border-color .15s ease, transform .15s ease, background .15s ease;
  display:block;
}
.cat-card:hover{ border-color:var(--lime-dim); background:var(--surface-2); transform:translateY(-2px); }
.cat-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cat-card .cat-code{
  font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--lime);
  background:var(--lime-glow); padding:3px 8px; border-radius:5px;
}
.cat-card .cat-count{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); }
.cat-card h3{ font-family:var(--font-display); font-size:18px; font-weight:600; margin-bottom:8px; }
.cat-card p{ font-size:13px; color:var(--text-muted); line-height:1.55; }

/* ---------- Module page ---------- */
.mod-header{ margin-bottom:36px; }
.mod-id-badge{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--lime);
  background:var(--lime-glow); border:1px solid rgba(195,245,60,0.25);
  padding:4px 10px; border-radius:6px; margin-bottom:16px;
}
.mod-header h1{
  font-family:var(--font-display); font-size:34px; font-weight:700; letter-spacing:-0.01em;
  margin-bottom:14px; line-height:1.18;
}
.mod-header .mod-desc{ font-size:16px; color:var(--text-muted); max-width:700px; }

.feature-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
.feature-card{
  border:1px solid var(--border); background:var(--surface);
  border-radius:10px; padding:18px;
  position:relative;
}
.feature-card::before{
  content:''; position:absolute; left:0; top:14px; bottom:14px; width:2px;
  background:var(--lime-dim); border-radius:2px; opacity:0.6;
}
.feature-card h4{ font-size:14.5px; font-weight:600; margin-bottom:6px; padding-left:12px; }
.feature-card p{ font-size:13px; color:var(--text-muted); padding-left:12px; line-height:1.55; }

.empty-note{
  border:1px dashed var(--border); border-radius:10px; padding:20px;
  color:var(--text-dim); font-size:13.5px; font-family:var(--font-mono);
}

.mod-nav{
  display:flex; justify-content:space-between; gap:16px; margin-top:56px;
  padding-top:24px; border-top:1px solid var(--border);
}
.mod-nav-link{
  flex:1; border:1px solid var(--border); border-radius:10px; padding:16px 18px;
  background:var(--surface);
  transition:border-color .15s ease, background .15s ease;
}
.mod-nav-link:hover{ border-color:var(--lime-dim); background:var(--surface-2); }
.mod-nav-link.next{ text-align:right; }
.mod-nav-link .lbl{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
.mod-nav-link .name{ font-size:14px; font-weight:600; color:var(--text); }

/* ---------- Command palette ---------- */
.cmdk-overlay{
  position:fixed; inset:0; z-index:100;
  background:var(--overlay-bg);
  backdrop-filter:blur(3px);
  display:none;
  align-items:flex-start; justify-content:center;
  padding-top:14vh;
}
.cmdk-overlay.open{ display:flex; }
.cmdk-box{
  width:100%; max-width:560px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; box-shadow:var(--shadow-box);
  overflow:hidden;
  max-height:70vh; display:flex; flex-direction:column;
}
.cmdk-input-row{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
.cmdk-input-row svg{ opacity:0.5; flex-shrink:0; }
.cmdk-input{
  flex:1; background:transparent; border:none; outline:none;
  color:var(--text); font-size:15px; font-family:var(--font-body);
}
.cmdk-input::placeholder{ color:var(--text-dim); }
.cmdk-esc{ font-family:var(--font-mono); font-size:10px; color:var(--text-dim); border:1px solid var(--border); padding:2px 6px; border-radius:4px; }
.cmdk-results{ overflow-y:auto; padding:8px; }
.cmdk-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:8px; font-size:13.5px;
  color:var(--text-muted);
}
.cmdk-item .mid{ font-family:var(--font-mono); font-size:10px; color:var(--lime-dim); background:var(--lime-glow); padding:2px 6px; border-radius:4px; flex-shrink:0; }
.cmdk-item .name{ color:var(--text); font-weight:500; }
.cmdk-item .cat{ margin-left:auto; font-size:11px; color:var(--text-dim); font-family:var(--font-mono); }
.cmdk-item.sel{ background:var(--lime-glow); }
.cmdk-empty{ padding:24px 12px; text-align:center; color:var(--text-dim); font-size:13px; }

/* ---------- Mobile ---------- */
.menu-toggle{ display:none; }
@media (max-width: 880px){
  .app{ grid-template-columns:1fr; }
  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:280px; z-index:20;
    transform:translateX(-100%); transition:transform .2s ease;
    box-shadow:var(--shadow-sidebar);
  }
  .sidebar.open{ transform:translateX(0); }
  .menu-toggle{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--text);
  }
  .hero h1{ font-size:32px; }
  .hero-stats{ grid-template-columns:1fr 1fr; }
  .cat-grid{ grid-template-columns:1fr; }
  .feature-grid{ grid-template-columns:1fr; }
  .content{ padding:0 20px 80px; }
  .topbar{ padding:12px 20px; }
  .stat-pill{ display:none; }
  .sidebar-scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:19; }
  .sidebar-scrim.open{ display:block; }
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="sidebar-scrim" id="scrim"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">α</div>
      <div>
        <div class="brand-name">Alphabet</div>
        <div class="brand-sub">ERP Docs</div>
      </div>
    </div>

    <button class="search-trigger" id="searchTrigger">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span>Search modules…</span>
      <span class="kbd">⌘K</span>
    </button>

    <a href="#/" class="nav-home" id="navHome">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Overview
    </a>

    <nav id="navSections"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb">Overview</div>

        <span class="stat-pill"><b>74</b> modules</span>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle light/dark theme">
          <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="menu-toggle" id="menuToggle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="cmdk-overlay" id="cmdk">
  <div class="cmdk-box">
    <div class="cmdk-input-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="cmdk-input" id="cmdkInput" placeholder="Search 74 modules across 8 categories…" autocomplete="off" />
      <span class="cmdk-esc">ESC</span>
    </div>
    <div class="cmdk-results" id="cmdkResults"></div>
  </div>
</div>

s \u2014 video conferencing, messaging, social media, and third-party tools all working together smoothly.","modules":[{"id":"CC-01","name":"Moodle Integration","slug":"moodle-integration","desc":"Keep Moodle as your LMS and connect it to Alphabet's ERP layer. Sync student enrollments, fee records, and academic data automatically.","features":[]},{"id":"CC-02","name":"BigBlueButton Integration","slug":"bigbluebutton-integration","desc":"Run a self-hosted, open-source virtual classroom on your own servers so student data never leaves campus. BigBlueButton brings education-native features \u2014 multi-user whiteboard, breakout rooms, shared notes, attendance sync \u2014 directly into your timetable and student information system.","features":[]},{"id":"CC-03","name":"Zoom Integration","slug":"zoom-integration","desc":"Alphabet's Zoom integration automatically creates meetings from your academic timetable and syncs attendance from Zoom participation data directly into the SIS, so faculty never manually create meeting links and coordinators never chase spreadsheets to verify who attended a virtual session.","features":[]},{"id":"CC-04","name":"WhatsApp Integration","slug":"whatsapp-integration","desc":"Send fee reminders, attendance alerts, and exam notifications to parents and students via WhatsApp Business API. Automated templates with read-receipt tracking achieve 95%+ open rates \u2014 compared to under 20% for institutional email.","features":[{"name":"Core Management","desc":"Essential whatsapp integration management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed whatsapp integration analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all whatsapp integration activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}]},{"id":"CC-05","name":"Social Media Marketing Tool","slug":"social-media-marketing-tool","desc":"Schedule and publish across Facebook, Instagram, LinkedIn, and Twitter from one calendar, auto-capture social form leads into the enrollment CRM, track every prospect from ad click through application to enrolled student, and calculate cost-per-enrolled-student for each campaign \u2014 all within your institution's existing platform.","features":[{"name":"Core Management","desc":"Essential social media marketing tool management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed social media marketing tool analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all social media marketing tool activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}]},{"id":"CC-06","name":"Google Meet Integration","slug":"google-meet-integration","desc":"Automatically generate Google Meet links from your timetable, sync sessions to Google Calendar, deliver links directly to each student's portal, and record attendance from join and leave data \u2014 eliminating manual link creation and the email-chain chaos that follows.","features":[{"name":"Core Management","desc":"Essential google meet integration management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed google meet integration analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all google meet integration activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}]},{"id":"CC-07","name":"Microsoft Teams Integration","slug":"microsoft-teams-integration","desc":"Many institutions are paying for Microsoft 365 Education E3 or A3 licenses but faculty still schedule academic sessions in Zoom or Google Meet while Teams sits unused for anything pedagogical. This integration connects your academic timetable directly to Teams \u2014 creating channels per course, scheduling meetings from the academic calendar, syncing student rosters from enrollment, and pulling attendance from meeting participation data \u2014 so the Microsoft licenses your institution is already paying for actually cover academic delivery.","features":[]}]}]}

<script>(function(){
  const DATA = JSON.parse(document.getElementById('alphabet-data').textContent);
  const CATS = DATA.categories;

  // Flatten module index for search / prev-next
  const ALL_MODULES = [];
  CATS.forEach(cat => {
    cat.modules.forEach(m => {
      ALL_MODULES.push({ ...m, catName: cat.name, catSlug: cat.slug, catCode: cat.code });
    });
  });

  const bySlug = {};
  ALL_MODULES.forEach(m => bySlug[m.slug] = m);

  const navSections = document.getElementById('navSections');
  const content = document.getElementById('content');
  const breadcrumb = document.getElementById('breadcrumb');
  const navHome = document.getElementById('navHome');

  // ---------- Build sidebar ----------
  function buildSidebar(){
    navSections.innerHTML = '';
    CATS.forEach(cat => {
      const section = document.createElement('div');
      section.className = 'nav-section';
      section.dataset.cat = cat.slug;

      const btn = document.createElement('button');
      btn.className = 'nav-cat-btn';
      btn.innerHTML = `
        <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 18 6-6-6-6"/></svg>
        <span class="cat-code">${cat.code}</span>
        <span>${cat.name}</span>
        <span class="cat-count">${cat.modules.length}</span>
      `;
      btn.addEventListener('click', () => {
        section.classList.toggle('open');
      });

      const modsWrap = document.createElement('div');
      modsWrap.className = 'nav-mods';
      cat.modules.forEach(mod => {
        const a = document.createElement('a');
        a.className = 'nav-mod-link';
        a.href = `#/module/${mod.slug}`;
        a.dataset.slug = mod.slug;
        a.innerHTML = `<span class="mod-id">${mod.id}</span><span>${mod.name}</span>`;
        modsWrap.appendChild(a);
      });

      section.appendChild(btn);
      section.appendChild(modsWrap);
      navSections.appendChild(section);
    });
  }

  function setActiveNav(slug){
    document.querySelectorAll('.nav-mod-link').forEach(a => {
      a.classList.toggle('active', a.dataset.slug === slug);
    });
    navHome.classList.toggle('active', !slug);
    if (slug){
      const mod = bySlug[slug];
      if (mod){
        const section = navSections.querySelector(`.nav-section[data-cat="${mod.catSlug}"]`);
        if (section) section.classList.add('open');
      }
    }
  }

  // ---------- Render: Home ----------
  function renderHome(){
    breadcrumb.textContent = 'Overview';
    const totalModules = ALL_MODULES.length;
    content.innerHTML = `
      <section class="hero">
        <div class="hero-eyebrow"><span class="dot"></span> Product documentation</div>
        <h1>One platform to run your entire <em>institution.</em></h1>
        <p class="lead">Alphabet replaces disconnected systems with a single education ERP — admissions, learning, finance, and campus operations sharing one database. This is the reference for every module.</p>
        <div class="hero-stats">
          <div class="hero-stat"><div class="num">${totalModules}</div><div class="lbl">Modules</div></div>
          <div class="hero-stat"><div class="num">8</div><div class="lbl">Categories</div></div>
          <div class="hero-stat"><div class="num">3M+</div><div class="lbl">Users worldwide</div></div>
          <div class="hero-stat"><div class="num">90+</div><div class="lbl">Countries</div></div>
        </div>
      </section>

      <div class="section-label">Browse by category</div>
      <div class="cat-grid">
        ${CATS.map(cat => `
          <a class="cat-card" href="#/category/${cat.slug}">
            <div class="cat-card-top">
              <span class="cat-code">${cat.code}</span>
              <span class="cat-count">${cat.modules.length} modules</span>
            </div>
            <h3>${cat.name}</h3>
            <p>${cat.blurb}</p>
          </a>
        `).join('')}
      </div>
    `;
    setActiveNav(null);
    window.scrollTo(0,0);
  }

  // ---------- Render: Category ----------
  function renderCategory(slug){
    const cat = CATS.find(c => c.slug === slug);
    if (!cat) return renderNotFound();
    breadcrumb.innerHTML = `<a href="#/">Overview</a><span class="sep">/</span><span class="current">${cat.name}</span>`;
    content.innerHTML = `
      <section class="mod-header">
        <span class="mod-id-badge">${cat.code} · ${cat.modules.length} modules</span>
        <h1>${cat.name}</h1>
        <p class="mod-desc">${cat.blurb}</p>
      </section>
      <div class="cat-grid">
        ${cat.modules.map(m => `
          <a class="cat-card" href="#/module/${m.slug}">
            <div class="cat-card-top">
              <span class="cat-code">${m.id}</span>
            </div>
            <h3>${m.name}</h3>
            <p>${m.desc}</p>
          </a>
        `).join('')}
      </div>
    `;
    setActiveNav(null);
    window.scrollTo(0,0);
  }

  // ---------- Render: Module ----------
  function renderModule(slug){
    const mod = bySlug[slug];
    if (!mod) return renderNotFound();
    const idx = ALL_MODULES.indexOf(mod);
    const prev = ALL_MODULES[idx - 1];
    const next = ALL_MODULES[idx + 1];

    breadcrumb.innerHTML = `<a href="#/">Overview</a><span class="sep">/</span><a href="#/category/${mod.catSlug}">${mod.catName}</a><span class="sep">/</span><span class="current">${mod.name}</span>`;

    const featuresHtml = mod.features && mod.features.length
      ? `<div class="section-label">Key capabilities</div>
         <div class="feature-grid">
           ${mod.features.map(f => `
             <div class="feature-card">
               <h4>${f.name}</h4>
               <p>${f.desc}</p>
             </div>
           `).join('')}
         </div>`
      : `<div class="section-label">Key capabilities</div>
         <div class="empty-note">// Detailed capability list not yet published for this module.</div>`;

    content.innerHTML = `
      <section class="mod-header">
        <span class="mod-id-badge">${mod.id} · ${mod.catName}</span>
        <h1>${mod.name}</h1>
        <p class="mod-desc">${mod.desc}</p>
      </section>
      ${featuresHtml}
      <div class="mod-nav">
        ${prev ? `<a class="mod-nav-link prev" href="#/module/${prev.slug}"><div class="lbl">← Previous</div><div class="name">${prev.name}</div></a>` : '<div style="flex:1"></div>'}
        ${next ? `<a class="mod-nav-link next" href="#/module/${next.slug}"><div class="lbl">Next →</div><div class="name">${next.name}</div></a>` : '<div style="flex:1"></div>'}
      </div>
    `;
    setActiveNav(slug);
    window.scrollTo(0,0);
  }

  function renderNotFound(){
    breadcrumb.textContent = 'Not found';
    content.innerHTML = `
      <section class="mod-header">
        <span class="mod-id-badge">404</span>
        <h1>Page not found</h1>
        <p class="mod-desc">That module doesn't exist. <a href="#/" style="color:var(--lime)">Back to overview →</a></p>
      </section>
    `;
    setActiveNav(null);
  }

  // ---------- Router ----------
  function route(){
    const hash = location.hash.replace(/^#/, '') || '/';
    const parts = hash.split('/').filter(Boolean);
    if (parts.length === 0){
      renderHome();
    } else if (parts[0] === 'category' && parts[1]){
      renderCategory(parts[1]);
    } else if (parts[0] === 'module' && parts[1]){
      renderModule(parts[1]);
    } else {
      renderNotFound();
    }
    closeMobileSidebar();
  }

  function navigate(hash){
    if (location.hash === hash){
      route(); // same hash, force re-render
    } else {
      location.hash = hash;
    }
  }

  window.addEventListener('hashchange', route);

  // Delegate clicks on any in-app link (href starting with #/), so navigation
  // works reliably even in sandboxed/preview contexts where native hash
  // navigation via <a href> can be unreliable.
  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href^="#/"]');
    if (!link) return;
    e.preventDefault();
    navigate(link.getAttribute('href'));
  });

  // ---------- Command palette ----------
  const cmdk = document.getElementById('cmdk');
  const cmdkInput = document.getElementById('cmdkInput');
  const cmdkResults = document.getElementById('cmdkResults');
  let selIndex = 0;
  let currentResults = [];

  function openCmdk(){
    cmdk.classList.add('open');
    cmdkInput.value = '';
    cmdkInput.focus();
    renderResults('');
  }
  function closeCmdk(){
    cmdk.classList.remove('open');
  }

  function renderResults(query){
    const q = query.trim().toLowerCase();
    let results;
    if (!q){
      results = ALL_MODULES.slice(0, 8);
    } else {
      results = ALL_MODULES.filter(m =>
        m.name.toLowerCase().includes(q) ||
        m.desc.toLowerCase().includes(q) ||
        m.catName.toLowerCase().includes(q) ||
        m.id.toLowerCase().includes(q)
      ).slice(0, 20);
    }
    currentResults = results;
    selIndex = 0;
    if (!results.length){
      cmdkResults.innerHTML = `<div class="cmdk-empty">No modules match “${query}”</div>`;
      return;
    }
    cmdkResults.innerHTML = results.map((m, i) => `
      <div class="cmdk-item ${i===0?'sel':''}" data-slug="${m.slug}" data-i="${i}">
        <span class="mid">${m.id}</span>
        <span class="name">${m.name}</span>
        <span class="cat">${m.catName}</span>
      </div>
    `).join('');
  }

  function updateSelHighlight(){
    cmdkResults.querySelectorAll('.cmdk-item').forEach(el => {
      el.classList.toggle('sel', Number(el.dataset.i) === selIndex);
    });
    const sel = cmdkResults.querySelector('.cmdk-item.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }

  function goToSelected(){
    const m = currentResults[selIndex];
    if (m){
      navigate(`#/module/${m.slug}`);
      closeCmdk();
    }
  }

  cmdkInput.addEventListener('input', (e) => renderResults(e.target.value));
  cmdkResults.addEventListener('click', (e) => {
    const item = e.target.closest('.cmdk-item');
    if (item){
      navigate(`#/module/${item.dataset.slug}`);
      closeCmdk();
    }
  });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      cmdk.classList.contains('open') ? closeCmdk() : openCmdk();
      return;
    }
    if (!cmdk.classList.contains('open')) return;
    if (e.key === 'Escape'){ closeCmdk(); }
    else if (e.key === 'ArrowDown'){ e.preventDefault(); selIndex = Math.min(selIndex+1, currentResults.length-1); updateSelHighlight(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); selIndex = Math.max(selIndex-1, 0); updateSelHighlight(); }
    else if (e.key === 'Enter'){ e.preventDefault(); goToSelected(); }
  });

  document.getElementById('searchTrigger').addEventListener('click', openCmdk);
  cmdk.addEventListener('click', (e) => { if (e.target === cmdk) closeCmdk(); });

  // ---------- Mobile sidebar ----------
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  document.getElementById('menuToggle').addEventListener('click', () => {
    sidebar.classList.add('open');
    scrim.classList.add('open');
  });
  scrim.addEventListener('click', closeMobileSidebar);
  function closeMobileSidebar(){
    sidebar.classList.remove('open');
    scrim.classList.remove('open');
  }

  // ---------- Theme ----------
  const THEME_KEY = 'alphabet-docs-theme';
  const root = document.documentElement;

  function applyTheme(theme){
    root.setAttribute('data-theme', theme);
  }

  function initTheme(){
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (saved === 'light' || saved === 'dark'){
      applyTheme(saved);
    } else {
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      applyTheme(prefersLight ? 'light' : 'dark');
    }
  }

  function toggleTheme(){
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  }

  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  initTheme();

  // ---------- Init ----------
  buildSidebar();
  route();
})();
</script>
</body>
</html>

  // ---------- Render: Category ----------
  function renderCategory(slug){
    const cat = CATS.find(c => c.slug === slug);
    if (!cat) return renderNotFound();
    breadcrumb.innerHTML = `<a href="#/">Overview</a><span class="sep">/</span><span class="current">${cat.name}</span>`;
    content.innerHTML = `
      <section class="mod-header">
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:16px;">
          ${catIcon(cat.slug, 'lg')}
          <span class="mod-id-badge" style="margin-bottom:0;">${cat.code} · ${cat.modules.length} modules</span>
        </div>
        <h1>${cat.name}</h1>
        <p class="mod-desc">${cat.blurb}</p>
      </section>
      <div class="cat-grid">
        ${cat.modules.map(m => `
          <a class="cat-card" href="#/module/${m.slug}">
            <div class="cat-card-top">
              <span class="cat-code">${m.id}</span>
            </div>
            <h3>${m.name}</h3>
            <p>${m.desc}</p>
          </a>
        `).join('')}
      </div>
    `;
    setActiveNav(null);
    window.scrollTo(0,0);
  }

  // ---------- Render: Module ----------
  function renderModule(slug){
    const mod = bySlug[slug];
    if (!mod) return renderNotFound();
    const idx = ALL_MODULES.indexOf(mod);
    const prev = ALL_MODULES[idx - 1];
    const next = ALL_MODULES[idx + 1];

    breadcrumb.innerHTML = `<a href="#/">Overview</a><span class="sep">/</span><a href="#/category/${mod.catSlug}">${mod.catName}</a><span class="sep">/</span><span class="current">${mod.name}</span>`;

    const featuresHtml = mod.features && mod.features.length
      ? `<div class="section-label">Key capabilities</div>
         <div class="feature-grid">
           ${mod.features.map(f => `
             <div class="feature-card">
               <div class="feature-card-icon">${icon(mod.catSlug)}</div>
               <h4>${f.name}</h4>
               <p>${f.desc}</p>
             </div>
           `).join('')}
         </div>`
      : `<div class="section-label">Key capabilities</div>
         <div class="empty-note">// Detailed capability list not yet published for this module.</div>`;

    const detailsHtml = mod.details && mod.details.length
      ? `<div class="section-label" style="margin-top:44px;">How it works</div>
         <div class="detail-list">
           ${mod.details.map(d => `
             <div class="detail-item">
               <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
               <p>${d}</p>
             </div>
           `).join('')}
         </div>`
      : '';

    content.innerHTML = `
      <section class="mod-header">
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:16px;">
          ${catIcon(mod.catSlug, 'lg')}
          <span class="mod-id-badge" style="margin-bottom:0;">${mod.id} · ${mod.catName}</span>
        </div>
        <h1>${mod.name}</h1>
        <p class="mod-desc">${mod.desc}</p>
      </section>
      ${featuresHtml}
      ${detailsHtml}
      <div class="mod-nav">
        ${prev ? `<a class="mod-nav-link prev" href="#/module/${prev.slug}"><div class="lbl">← Previous</div><div class="name">${prev.name}</div></a>` : '<div style="flex:1"></div>'}
        ${next ? `<a class="mod-nav-link next" href="#/module/${next.slug}"><div class="lbl">Next →</div><div class="name">${next.name}</div></a>` : '<div style="flex:1"></div>'}
      </div>
    `;
    setActiveNav(slug);
    window.scrollTo(0,0);
  }

  // ---------- API helpers ----------
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function jsonHighlight(obj){
    if (obj === null || obj === undefined) return '<span class="tok-null">null</span>';
    const json = JSON.stringify(obj, null, 2);
    const escaped = escapeHtml(json);
    return escaped.replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+\.?\d*(?:[eE][+-]?\d+)?)/g,
      (match) => {
        if (/^"/.test(match)){
          return /:$/.test(match) ? `<span class="tok-key">${match.replace(/:$/,'')}</span>:` : `<span class="tok-str">${match}</span>`;
        }
        if (/true|false/.test(match)) return `<span class="tok-bool">${match}</span>`;
        if (/null/.test(match)) return `<span class="tok-null">${match}</span>`;
        return `<span class="tok-num">${match}</span>`;
      }
    );
  }

  function placeholderForParam(name){
    const n = name.toLowerCase();
    if (n.includes('email')) return 'jane.doe@example.com';
    if (n.includes('code')) return 'ABC123';
    if (n.includes('userid') || n === 'id') return '3fa85f64-5717-4562-b3fc-2c963f66afa6';
    if (n.includes('token')) return 'YOUR_TOKEN';
    return `YOUR_${name.toUpperCase()}`;
  }

  function snippetsFor(ep){
    const base = 'https://api.iiwi.app';
    let url = `${base}${ep.path}`;
    if (ep.parameters && ep.parameters.length){
      const qs = ep.parameters.map(p => `${p.name}=${encodeURIComponent(placeholderForParam(p.name))}`).join('&');
      url += `?${qs}`;
    }
    const hasBody = !!ep.requestBody;
    const bodyObj = hasBody ? ep.requestBody.example : null;
    const bodyJson = hasBody ? JSON.stringify(bodyObj, null, 2) : '';
    const bodyJsonIndented = hasBody ? JSON.stringify(bodyObj, null, 2).split('\n').join('\n  ') : '';

    // ---- cURL ----
    let curl = `curl -X ${ep.method} "${url}"`;
    if (ep.requiresAuth) curl += ` \\\n  -H "Authorization: Bearer YOUR_ACCESS_TOKEN"`;
    if (hasBody){
      curl += ` \\\n  -H "Content-Type: application/json"`;
      curl += ` \\\n  -d '${bodyJson.replace(/'/g, "\\'")}'`;
    }

    // ---- JavaScript (fetch) ----
    let js = `const response = await fetch("${url}", {\n  method: "${ep.method}",\n  headers: {`;
    const jsHeaders = [];
    if (hasBody) jsHeaders.push(`    "Content-Type": "application/json"`);
    if (ep.requiresAuth) jsHeaders.push(`    "Authorization": "Bearer YOUR_ACCESS_TOKEN"`);
    js += `\n${jsHeaders.join(',\n')}\n  }`;
    if (hasBody){
      js += `,\n  body: JSON.stringify(${bodyJsonIndented})`;
    }
    js += `\n});\n\nconst data = await response.json();`;

    // ---- Python (requests) ----
    let py = `import requests\n\nurl = "${url}"\n`;
    const pyHeaders = [];
    if (hasBody) pyHeaders.push(`    "Content-Type": "application/json"`);
    if (ep.requiresAuth) pyHeaders.push(`    "Authorization": "Bearer YOUR_ACCESS_TOKEN"`);
    if (pyHeaders.length){
      py += `headers = {\n${pyHeaders.join(',\n')}\n}\n`;
    }
    if (hasBody){
      py += `payload = ${bodyJson.replace(/null/g, 'None').replace(/true/g, 'True').replace(/false/g, 'False')}\n`;
    }
    const pyArgs = [];
    if (pyHeaders.length) pyArgs.push('headers=headers');
    if (hasBody) pyArgs.push('json=payload');
    py += `\nresponse = requests.${ep.method.toLowerCase()}(url${pyArgs.length ? ', ' + pyArgs.join(', ') : ''})\nprint(response.json())`;

    // ---- Node.js (axios) ----
    let node = `const axios = require("axios");\n\n`;
    const nodeHeaders = [];
    if (hasBody) nodeHeaders.push(`    "Content-Type": "application/json"`);
    if (ep.requiresAuth) nodeHeaders.push(`    "Authorization": "Bearer YOUR_ACCESS_TOKEN"`);
    node += `axios({\n  method: "${ep.method.toLowerCase()}",\n  url: "${url}"`;
    if (nodeHeaders.length) node += `,\n  headers: {\n${nodeHeaders.join(',\n')}\n  }`;
    if (hasBody) node += `,\n  data: ${bodyJsonIndented}`;
    node += `\n})\n  .then(res => console.log(res.data))\n  .catch(err => console.error(err));`;

    return [
      { lang: 'curl', label: 'cURL', code: curl },
      { lang: 'javascript', label: 'JavaScript', code: js },
      { lang: 'python', label: 'Python', code: py },
      { lang: 'node', label: 'Node.js', code: node },
    ];
  }

  function codeBlock(label, codeHtml, rawText){
    const id = 'code-' + Math.random().toString(36).slice(2, 9);
    return `
      <div class="code-block">
        <div class="code-block-head">
          <span>${label}</span>
          <button class="copy-btn" data-copy-target="${id}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>
        <pre id="${id}" data-raw="${escapeHtml(rawText)}"><code>${codeHtml}</code></pre>
      </div>
    `;
  }

  function codeBlockMulti(snippets){
    const blockId = 'mcode-' + Math.random().toString(36).slice(2, 9);
    return `
      <div class="code-block" data-multi-id="${blockId}">
        <div class="code-block-head">
          <div class="code-tabs">
            ${snippets.map((s, i) => `<button class="code-tab ${i===0?'active':''}" data-lang="${s.lang}">${s.label}</button>`).join('')}
          </div>
          <button class="copy-btn" data-copy-multi="${blockId}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>
        ${snippets.map((s, i) => `
          <pre class="code-pane ${i===0?'active':''}" data-lang="${s.lang}" data-raw="${escapeHtml(s.code)}"><code>${escapeHtml(s.code)}</code></pre>
        `).join('')}
      </div>
    `;
  }

  function fieldTable(fields){
    if (!fields || !fields.length) return '';
    return `
      <table class="field-table">
        <thead><tr><th>Field</th><th>Type</th><th>Required</th></tr></thead>
        <tbody>
          ${fields.map(f => `
            <tr>
              <td>${f.name}</td>
              <td class="type-tag">${f.type}${f.nullable ? ' | null' : ''}</td>
              <td>${f.required ? '<span class="req-tag">required</span>' : '—'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  // ---------- Render: API Overview ----------
  function renderApiOverview(){
    breadcrumb.innerHTML = `<span class="current">API Reference</span>`;
    content.innerHTML = `
      <section class="mod-header">
        <span class="mod-id-badge">${API.info.version} · REST API</span>
        <h1>${escapeHtml(API.info.title)} API</h1>
        <p class="mod-desc">${escapeHtml(API.info.description)}</p>
      </section>

      <div class="api-intro-grid">
        <div class="api-info-card">
          <div class="lbl">Authentication</div>
          <div class="val">Bearer (JWT)</div>
        </div>
        <div class="api-info-card">
          <div class="lbl">Total endpoints</div>
          <div class="val">${ALL_ENDPOINTS.length} across ${API.groups.length} groups</div>
        </div>
      </div>

      <div class="section-label">Endpoint groups</div>
      <div class="cat-grid">
        ${API.groups.map(g => `
          <a class="cat-card" href="#/api/endpoint/${g.endpoints[0].slug}">
            <div class="cat-card-top">
              <span class="cat-code">${g.endpoints.length} endpoints</span>
            </div>
            <h3>${g.label}</h3>
            <p>${g.endpoints.map(e => e.method).filter((v,i,a)=>a.indexOf(v)===i).join(' · ')} requests for ${g.label.toLowerCase()} operations.</p>
          </a>
        `).join('')}
      </div>

      <div class="section-label">All endpoints</div>
      <div class="detail-list" style="margin-bottom:40px;">
        ${ALL_ENDPOINTS.map(e => `
          <a class="detail-item" href="#/api/endpoint/${e.slug}" style="text-decoration:none; cursor:pointer;">
            <span class="method-badge ${e.method.toLowerCase()}">${e.method}</span>
            <p style="color:var(--text);"><span style="font-family:var(--font-mono); font-size:13px;">${e.path}</span> — <span style="color:var(--text-muted);">${escapeHtml(e.summary)}</span></p>
          </a>
        `).join('')}
      </div>
    `;
    setActiveApiEndpoint(null);
    window.scrollTo(0,0);
  }

  // ---------- Render: API Endpoint ----------
  function renderApiEndpoint(slug){
    const ep = endpointBySlug[slug];
    if (!ep) return renderNotFound();
    const idx = ALL_ENDPOINTS.indexOf(ep);
    const prev = ALL_ENDPOINTS[idx - 1];
    const next = ALL_ENDPOINTS[idx + 1];

    breadcrumb.innerHTML = `<a href="#/api">API Reference</a><span class="sep">/</span><span class="current">${ep.groupLabel}</span>`;

    const paramsHtml = ep.parameters && ep.parameters.length
      ? `<div class="section-label">Query parameters</div>
         <table class="field-table">
           <thead><tr><th>Name</th><th>In</th><th>Type</th><th>Required</th></tr></thead>
           <tbody>
             ${ep.parameters.map(p => `
               <tr>
                 <td>${p.name}</td>
                 <td class="type-tag">${p.in}</td>
                 <td class="type-tag">${p.type}</td>
                 <td>${p.required ? '<span class="req-tag">required</span>' : '—'}</td>
               </tr>
             `).join('')}
           </tbody>
         </table>`
      : '';

    const requestBodyHtml = ep.requestBody
      ? `<div class="section-label">Request body ${ep.requestBody.schemaName ? `<span style="text-transform:none; font-weight:400;">— ${ep.requestBody.schemaName}</span>` : ''}</div>
         ${fieldTable(ep.requestBody.fields)}
         ${codeBlock('Example request body', jsonHighlight(ep.requestBody.example), JSON.stringify(ep.requestBody.example, null, 2))}`
      : '';

    const responsesHtml = ep.responses && ep.responses.length
      ? `<div class="section-label">Responses</div>
         ${ep.responses.map(r => `
           <div class="response-block">
             <div class="response-status">
               <span class="status-code ${r.status.startsWith('2') ? 's2' : 's4'}">${r.status}</span>
               <span class="status-desc">${escapeHtml(r.description)}${r.schemaName ? ' · ' + r.schemaName : ''}</span>
             </div>
             ${r.example ? codeBlock(`${r.status} response`, jsonHighlight(r.example), JSON.stringify(r.example, null, 2)) : ''}
           </div>
         `).join('')}`
      : '';

    const snippets = snippetsFor(ep);

    content.innerHTML = `
      <section class="mod-header">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
          <span class="method-badge lg ${ep.method.toLowerCase()}">${ep.method}</span>
          <span class="mod-id-badge" style="margin-bottom:0;">${ep.groupLabel}</span>
        </div>
        <h1>${escapeHtml(ep.summary)}</h1>
        <p class="mod-desc">${escapeHtml(ep.description)}</p>
      </section>

      <div class="api-endpoint-path">
        <span>${ep.path}</span>
        <span class="auth-pill ${ep.requiresAuth ? 'required' : ''}">
          ${ep.requiresAuth ? '🔒 Bearer token required' : '🔓 Public endpoint'}
        </span>
      </div>

      ${paramsHtml}
      ${requestBodyHtml}
      ${responsesHtml}

      <div class="section-label">Example request</div>
      ${codeBlockMulti(snippets)}

      <div class="mod-nav">
        ${prev ? `<a class="mod-nav-link prev" href="#/api/endpoint/${prev.slug}"><div class="lbl">← Previous</div><div class="name">${prev.method} ${prev.path}</div></a>` : '<div style="flex:1"></div>'}
        ${next ? `<a class="mod-nav-link next" href="#/api/endpoint/${next.slug}"><div class="lbl">Next →</div><div class="name">${next.method} ${next.path}</div></a>` : '<div style="flex:1"></div>'}
      </div>
    `;
    setActiveApiEndpoint(slug);
    window.scrollTo(0,0);
  }

  function renderNotFound(){
    breadcrumb.textContent = 'Not found';
    content.innerHTML = `
      <section class="mod-header">
        <span class="mod-id-badge">404</span>
        <h1>Page not found</h1>
        <p class="mod-desc">That module doesn't exist. <a href="#/" style="color:var(--lime)">Back to overview →</a></p>
      </section>
    `;
    setActiveNav(null);
  }

  // ---------- Router ----------
  function route(){
    const hash = location.hash.replace(/^#/, '') || '/';
    const parts = hash.split('/').filter(Boolean);
    if (parts.length === 0){
      renderHome();
    } else if (parts[0] === 'category' && parts[1]){
      renderCategory(parts[1]);
    } else if (parts[0] === 'module' && parts[1]){
      renderModule(parts[1]);
    } else if (parts[0] === 'api' && parts[1] === 'endpoint' && parts[2]){
      renderApiEndpoint(parts[2]);
    } else if (parts[0] === 'api'){
      renderApiOverview();
    } else {
      renderNotFound();
    }
    closeMobileSidebar();
  }

  function navigate(hash){
    if (location.hash === hash){
      route(); // same hash, force re-render
    } else {
      location.hash = hash;
    }
  }

  window.addEventListener('hashchange', route);

  // Delegate clicks on any in-app link (href starting with #/), so navigation
  // works reliably even in sandboxed/preview contexts where native hash
  // navigation via <a href> can be unreliable.
  document.addEventListener('click', (e) => {
    const link = e.target.closest('a[href^="#/"]');
    if (link){
      e.preventDefault();
      navigate(link.getAttribute('href'));
      return;
    }
    const tab = e.target.closest('.code-tab');
    if (tab){
      const block = tab.closest('.code-block');
      block.querySelectorAll('.code-tab').forEach(t => t.classList.toggle('active', t === tab));
      block.querySelectorAll('.code-pane').forEach(p => p.classList.toggle('active', p.dataset.lang === tab.dataset.lang));
      return;
    }
    const copyBtn = e.target.closest('.copy-btn');
    if (copyBtn){
      let text = '';
      if (copyBtn.dataset.copyTarget){
        const el = document.getElementById(copyBtn.dataset.copyTarget);
        text = el ? el.dataset.raw : '';
      } else if (copyBtn.dataset.copyMulti){
        const block = copyBtn.closest('.code-block');
        const active = block.querySelector('.code-pane.active');
        text = active ? active.dataset.raw : '';
      }
      const finish = () => {
        const original = copyBtn.innerHTML;
        copyBtn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg> Copied';
        setTimeout(() => { copyBtn.innerHTML = original; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(finish).catch(finish);
      } else {
        finish();
      }
    }
  });

  // ---------- Command palette ----------
  const cmdk = document.getElementById('cmdk');
  const cmdkInput = document.getElementById('cmdkInput');
  const cmdkResults = document.getElementById('cmdkResults');
  let selIndex = 0;
  let currentResults = [];

  function openCmdk(){
    cmdk.classList.add('open');
    cmdkInput.value = '';
    cmdkInput.focus();
    renderResults('');
  }
  function closeCmdk(){
    cmdk.classList.remove('open');
  }

  function renderResults(query){
    const q = query.trim().toLowerCase();
    let modResults, epResults;
    if (!q){
      modResults = ALL_MODULES.slice(0, 6);
      epResults = ALL_ENDPOINTS.slice(0, 4);
    } else {
      modResults = ALL_MODULES.filter(m =>
        m.name.toLowerCase().includes(q) ||
        m.desc.toLowerCase().includes(q) ||
        m.catName.toLowerCase().includes(q) ||
        m.id.toLowerCase().includes(q)
      ).slice(0, 14);
      epResults = ALL_ENDPOINTS.filter(e =>
        e.path.toLowerCase().includes(q) ||
        e.summary.toLowerCase().includes(q) ||
        e.method.toLowerCase().includes(q) ||
        e.groupLabel.toLowerCase().includes(q)
      ).slice(0, 10);
    }
    const results = [
      ...modResults.map(m => ({ kind: 'module', ...m })),
      ...epResults.map(e => ({ kind: 'endpoint', ...e })),
    ];
    currentResults = results;
    selIndex = 0;
    if (!results.length){
      cmdkResults.innerHTML = `<div class="cmdk-empty">No matches for “${query}”</div>`;
      return;
    }
    cmdkResults.innerHTML = results.map((r, i) => {
      if (r.kind === 'module'){
        return `
          <div class="cmdk-item ${i===0?'sel':''}" data-i="${i}">
            <span class="mid">${r.id}</span>
            <span class="name">${r.name}</span>
            <span class="cat">${r.catName}</span>
          </div>
        `;
      }
      return `
        <div class="cmdk-item ${i===0?'sel':''}" data-i="${i}">
          <span class="method-badge ${r.method.toLowerCase()}">${r.method}</span>
          <span class="name" style="font-family:var(--font-mono); font-size:12.5px;">${r.path}</span>
          <span class="cat">${r.groupLabel}</span>
        </div>
      `;
    }).join('');
  }

  function updateSelHighlight(){
    cmdkResults.querySelectorAll('.cmdk-item').forEach(el => {
      el.classList.toggle('sel', Number(el.dataset.i) === selIndex);
    });
    const sel = cmdkResults.querySelector('.cmdk-item.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }

  function goToSelected(){
    const r = currentResults[selIndex];
    if (r){
      navigate(r.kind === 'module' ? `#/module/${r.slug}` : `#/api/endpoint/${r.slug}`);
      closeCmdk();
    }
  }

  cmdkInput.addEventListener('input', (e) => renderResults(e.target.value));
  cmdkResults.addEventListener('click', (e) => {
    const item = e.target.closest('.cmdk-item');
    if (item){
      const i = Number(item.dataset.i);
      const r = currentResults[i];
      if (r){
        navigate(r.kind === 'module' ? `#/module/${r.slug}` : `#/api/endpoint/${r.slug}`);
        closeCmdk();
      }
    }
  });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      cmdk.classList.contains('open') ? closeCmdk() : openCmdk();
      return;
    }
    if (!cmdk.classList.contains('open')) return;
    if (e.key === 'Escape'){ closeCmdk(); }
    else if (e.key === 'ArrowDown'){ e.preventDefault(); selIndex = Math.min(selIndex+1, currentResults.length-1); updateSelHighlight(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); selIndex = Math.max(selIndex-1, 0); updateSelHighlight(); }
    else if (e.key === 'Enter'){ e.preventDefault(); goToSelected(); }
  });

  document.getElementById('searchTrigger').addEventListener('click', openCmdk);
  cmdk.addEventListener('click', (e) => { if (e.target === cmdk) closeCmdk(); });

  // ---------- Mobile sidebar ----------
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  document.getElementById('menuToggle').addEventListener('click', () => {
    sidebar.classList.add('open');
    scrim.classList.add('open');
  });
  scrim.addEventListener('click', closeMobileSidebar);
  function closeMobileSidebar(){
    sidebar.classList.remove('open');
    scrim.classList.remove('open');
  }

  // ---------- Theme ----------
  const THEME_KEY = 'alphabet-docs-theme';
  const root = document.documentElement;

  function applyTheme(theme){
    root.setAttribute('data-theme', theme);
  }

  function initTheme(){
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (saved === 'light' || saved === 'dark'){
      applyTheme(saved);
    } else {
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      applyTheme(prefersLight ? 'light' : 'dark');
    }
  }

  function toggleTheme(){
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  }

  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  initTheme();

  // ---------- Init ----------
  buildSidebar();
  buildApiSidebar();
  route();
})();
</script>
</body>
</html>

calls asking for basic route information during the first three weeks of school"]},{"id":"CO-02","name":"Parent Portal and Login System","slug":"parent-portal-and-login-system","desc":"Give parents a self-service portal to check grades, attendance, fee balances, and teacher messages in real time. Front-office call volume drops, fee collection speeds up, and families actually stay informed instead of waiting for report card day.","features":[{"name":"Alerts","desc":"Receive immediate notification when child is marked absent"},{"name":"Daily Attendance","desc":"View each day's attendance status as recorded by teachers"},{"name":"Absence History","desc":"Complete record of absences with reasons and documentation"},{"name":"Trends","desc":"Visualize attendance patterns over time"},{"name":"Leave Requests","desc":"Submit absence notifications or leave requests digitally"},{"name":"Campus & Hostel Management System","desc":"Manage hostel allocations, facility bookings, inventories, maintenance, and multi-campus operations from a single system linked to student records, fees, and timetables giving housing directors real-time occupancy and cost insights."},{"name":"Hostel and Residence Hall Allocation Without","desc":"Spreadsheet Conflicts Assign 3,200 beds in days instead of weeks, with every allocation validated against enrollment status, accommodation requirements, hall eligibility rules, and actual room availability."}],"details":["Parents check current grades, assignment scores, and GPA from their own dashboard instead of calling the registrar","Daily attendance status appears within seconds of a teacher marking the roll, parents know their child arrived before lunch","Outstanding fee balances, payment history, and due dates are visible 24/7 with one-click online payment","Grade breakdowns show performance by assignment type, parents see a pattern of missed homework before it tanks the semester average","Attendance trend visualizations flag emerging patterns: three late arrivals in two weeks, or a string of Friday absences","Automated alerts notify parents immediately when a child is marked absent unexpectedly, not days later in a phone call","Multi-child families switch between students from a single login. No separate accounts per child","Relationship-based access lets primary guardians see and pay fees while secondary contacts get view-only access to academics","Divorced or separated parents receive independent accounts with access boundaries configured by your admin team"]},{"id":"CO-03","name":"Campus & Hostel Management System","slug":"campus-hostel-management-system","desc":"Manage hostel allocations, facility bookings, inventories, maintenance, and multi-campus operations from a single system linked to student records, fees, and timetables giving housing directors real-time occupancy and cost insights.","features":[{"name":"Core Management","desc":"Essential campus management system management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed campus management system analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all campus management system activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}],"details":["Room allocation pulls live enrollment data from the Student Information System, so a student who withdrew, transferred, or deferred cannot occupy a bed that should go to an active enrollee","Accommodation flags on student profiles automatically filter out rooms that do not meet mobility, medical, dietary proximity, or other documented requirements before the housing officer sees options","Capacity enforcement prevents over-allocation at every level from room to hall to campus. The system will not assign a third student to a double-occupancy room regardless of manual override attempts","Booking requests check against timetable-scheduled classes, other facility reservations, maintenance blocks, and event holds simultaneously, a conflict with any one of those four sources prevents the double-booking before it is saved","Capacity-based search lets a department chair enter a headcount and required amenities, then see only the rooms across all campuses that actually fit the need, with availability shown for the requested date range","Structured maintenance workflow moves requests from submission through assignment, parts procurement, active repair, and completion, with timestamps at each stage that measure actual response and resolution times","Cost tracking at the room level rolls up from floor to building to campus totals, so the facilities team can show that Harrison Hall spent $187,000 on maintenance last year while Lincoln Hall spent $62,000","Preventive maintenance schedules attach to facility records with automated reminders, ensuring HVAC inspections, fire safety checks, and elevator certifications do not slip through the cracks of a manual calendar"]},{"id":"CO-04","name":"Placement Management Software","slug":"placement-management-software","desc":"Manage campus recruitment, match students to employer openings using academic and skill profiles, schedule interviews, track offers, and report placements giving officers real-time insights from a single dashboard without chasing spreadsheets.","features":[{"name":"Core Management","desc":"Essential placement cell and career services management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed placement cell and career services analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all placement cell and career services activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}],"details":["Eligibility lists generate automatically from real-time academic data (GPA, completed courses, attendance percentage, skill certifications) eliminating the 6-8 hour spreadsheet merge that placement coordinators repeat for every visiting company","Student skill profiles aggregate academic performance, project work, internship records, and co-curricular participation into candidate profiles that companies can review before campus visits, reducing mismatched applications by up to 40%","Automated notifications reach every eligible student when a new opportunity is posted, using verified contact data from the student record system rather than an outdated placement office mailing list","Interview scheduling cross-references each candidate's class timetable, exam dates, and other recruitment drive commitments before assigning a slot, conflicts surface during planning, not when the candidate fails to show up","Multi-round tracking records aptitude test scores, group discussion ratings, technical interview feedback, and HR panel notes for every candidate at each stage, creating a progression record the placement cell can analyze across cohorts","Company-side portal access lets recruiters view candidate profiles, download filtered applicant lists, submit interview feedback, and confirm offer details without exchanging spreadsheets over email","Offer tracking follows each student from initial offer receipt through acceptance confirmation, joining date recording, and final placement verification, eliminating the 11% of outcomes that go unrecorded in manual systems","Accreditation-ready reports for bodies like NAAC, NBA, ABET and NIRF as well as institutional rankings pull placement rates, average packages, sector-wise distribution, and gender breakdowns from verified data rather than manually assembled spreadsheets","Year-over-year trend analysis shows placement rate progression, average salary growth, employer retention rates, and new company acquisition, giving the provost evidence-based answers about whether placement outcomes are improving"]},{"id":"CO-05","name":"Canteen Management System for Schools","slug":"canteen-management-system-for-schools","desc":"Manage campus dining from menu planning to POS checkout, inventory, meal billing, and dietary compliance all integrated with student records, parent accounts, and accounting for real-time sales insights across every location.","features":[],"details":["Student wallet balances accept deposits from parent portal payments, bank transfers, or front-office cash loads, with every inflow and outflow tracked to a timestamped ledger entry that the finance office can audit without calling food services","Meal plan allocations deduct automatically at the POS when a student scans their ID, enforcing daily limits per meal type so a student on a lunch-only plan cannot charge breakfast without the system flagging the exception","Parent billing pulls directly from transaction records. No spreadsheet intermediary, no monthly tally submission from food services, no discrepancies between what the cafeteria reported and what the finance office invoiced","Recipe-level ingredient mapping means selling 340 taco plates automatically deducts ground beef, flour tortillas, shredded cheese, diced lettuce, and salsa from inventory in the exact quantities defined in the recipe card","Reorder alerts trigger when any ingredient drops below a configurable minimum threshold, giving the kitchen manager 48 hours of lead time before a stockout affects the lunch line","Purchase suggestion reports compare current stock levels against the upcoming week's planned menu and the previous month's consumption velocity, replacing the Monday morning guessing game","Dietary profiles stored in the student record carry allergy codes, religious restrictions, physician notes, and parent-specified preferences that surface as color-coded alerts on the POS screen during every transaction","Item-level allergen tagging marks each menu item with its allergen content so the system can warn the cashier when a student with a tree nut allergy attempts to purchase a cookie containing almond flour","Substitute cashiers see the same dietary alerts as regular staff because the data lives in the student profile, not in the cashier's memory or on a laminated reference card taped to the register"]}]},{"name":"Engagement & Outreach","code":"EO","slug":"engagement-outreach","blurb":"Keep every stakeholder informed and engaged \u2014 news, forums, surveys, grievance resolution, helpdesk, and appointment scheduling.","modules":[{"id":"EO-01","name":"Polls & Quick Surveys","slug":"polls-quick-surveys","desc":"Get constituent feedback in hours, not weeks. Publish targeted polls to students, faculty, or staff directly through the portal and mobile app, watch responses accumulate in real time, and bring quantified majority sentiment into committee meetings before decisions are finalized \u2014 not three weeks after the damage is done.","features":[{"name":"Core Management","desc":"Essential polls & quick surveys management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed polls & quick surveys analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all polls & quick surveys activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}],"details":["Create a poll with a question, response options, anonymity settings, and a voting deadline in under five minutes. No survey template, no distribution workflow, no vendor coordination","Publish directly to the student portal, faculty intranet, or mobile app so the poll appears in front of the audience the moment it goes live rather than waiting for an email to be opened","Collect majority-level responses within 24 to 72 hours on typical campus proposals, giving committees real data at their next scheduled meeting rather than weeks after the agenda closes","Each committee poll has a defined voting window with a hard close time, preventing late votes from reopening a settled count or committee members from changing their position after seeing results trend","Single-vote enforcement blocks double-voting at the system level, when a committee member submits a vote, the system records it and locks that respondent out of resubmission, eliminating the contested-count problem","The vote record shows who voted, when they voted, and how they voted (for authenticated non-anonymous polls), giving the committee secretary an exportable tally that withstands scrutiny at the next governance review","Pre-decision polls gauge directional support before a proposal reaches committee, surfacing majority opposition or specific concern patterns that allow proposal authors to address issues in the design rather than in the damage-control phase","Post-decision polls measure satisfaction with implemented changes at 30 days and 90 days, providing a feedback loop that shows whether the adjustment achieved its intended outcome or created secondary problems","Recurring pulse polls on ongoing initiatives, campus safety perception, dining satisfaction, library hours adequacy, advising accessibility, establish a baseline and track directional change across semesters without administering a new formal survey each time"]},{"id":"EO-02","name":"Helpdesk & Support Tickets","slug":"helpdesk-support-tickets","desc":"Manage IT requests, student affairs inquiries, and facilities tickets from a single system with automated routing, SLA timers, and real-time queue visibility. Support staff and administrators can monitor response times and workload across all departments without toggling between separate tools.","features":[{"name":"Core Management","desc":"Essential helpdesk & support tickets management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"}],"details":["Manage IT requests, student affairs inquiries, and facilities tickets from a single system with automated routing, SLA timers, and real-time queue visibility.","Automatic assignment routes each ticket to the right team within seconds based on category, campus location, requester type, and current agent workload","Priority queues separate graduation-blocking holds and critical infrastructure failures from standard password resets, agents work the highest-impact items first without manual triage","SLA timers start the moment a ticket is created and trigger escalation notifications at configurable thresholds before deadlines are missed","Students and staff search the knowledge base before submitting a ticket, articles for the top recurring issues reduce ticket volume by 25\u201335% without adding staff headcount","Agents convert resolved tickets into knowledge base articles in one step, capturing institutional knowledge before it walks out the door with departing staff","Article analytics show which topics generate the most views and which searches return no results, identifying gaps in documentation that correlate with high ticket volume","IT, student affairs, and facilities run separate queues within a single system, leadership sees aggregate service performance across all departments without requesting exports from 3 separate tools","Response-time dashboards show open, pending, and resolved ticket counts by department, agent, category, and time period, giving Directors of IT the data they need to justify staffing requests","Student satisfaction surveys trigger automatically at ticket resolution, generating a continuous satisfaction score that does not require manual survey campaigns"]},{"id":"EO-03","name":"Community Forums","slug":"community-forums","desc":"A persistent, searchable forum platform where faculty answer course questions once and all students benefit, peer study networks form across sections and cohorts, and alumni retain forum access after graduation to mentor current students. Campus community engagement moves from individual email threads to a shared institutional knowledge base that grows with each cohort.","features":[{"name":"Core Management","desc":"Essential community forums management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"}],"details":["Faculty post a single answer to a forum question and all students enrolled across every section of that course see it immediately, eliminating the 40-to-50 individual email Q&A cycle that repeats each semester in high-enrollment courses","Course forums are archived and indexed at semester close, so students in future cohorts can search for answers before emailing the professor, reducing repeat question volume by 35% to 55% in the first full semester based on documented adoption data","Q&A format with upvoting and accepted answers surfaces the most useful responses at the top of each thread, so students find the authoritative answer without reading through an entire discussion to determine which reply is correct","Program-wide forums allow students in different sections of the same major to interact, a first-generation junior can ask a senior in another section how they approached the thesis proposal without needing a personal introduction","Study group formation threads let students in the same course section or exam cohort find each other by schedule availability, study method, or location, reducing the isolation that large lecture environments create for students who transfer in or commute","Reputation systems award points for posting questions that others find useful and for answers that receive upvotes or are marked accepted, giving students a concrete signal that their participation contributes to the community rather than just their own grade","Graduating seniors receive alumni forum access during their final semester. They join program-specific alumni communities before commencement, so the transition from student to alumni is a continuation rather than a reset","Alumni retain full read and write access to their program forums after graduation, allowing them to answer questions from current students and participate in mentorship discussions without requiring a separate alumni platform subscription or a new account","Alumni forum participation generates behavioral engagement data that advancement teams can use to identify which alumni have an active relationship with the institution, participation frequency, response quality, and thread topics are more actionable signals than email open rates"]},{"id":"EO-04","name":"Secure Transcript","slug":"secure-transcript","desc":"Generate tamper-proof academic transcripts with digital signatures, QR code verification, institutional watermarks, and batch processing for graduation cycles. Students order transcripts through a self-service portal, pay online, and track delivery status. Hold enforcement blocks release when financial obligations are unresolved. FERPA-compliant access controls govern every step from request to recipient.","features":[{"name":"Core Management","desc":"Essential secure transcript management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed secure transcript analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all secure transcript activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}],"details":["Academic records, courses, grades, credits earned, cumulative GPA, honors designations, degree conferral dates, populate the transcript template directly from the SIS with zero manual data transfer between systems","Name changes, program changes, grade corrections, and enrollment status updates made in the SIS reflect on the next transcript generated without requiring staff to cross-check a separate template or document store","GPA calculations use the same formula and rounding rules as the SIS, eliminating the discrepancies that occur when staff manually calculate or copy a GPA that was rounded differently in the source system","QR codes printed on every transcript link to your institution's verification server, recipients scan with any smartphone camera and see confirmation of the document's authenticity, issue date, student name, and degree status within seconds","Digital signatures from the registrar's office are embedded in the PDF, providing cryptographic proof that the document was issued by your institution and has not been altered since generation","Security watermarks and anti-tampering protections make physical and digital forgery attempts visually and technically detectable by both human reviewers and automated verification systems","Students submit transcript requests through the portal at any hour, specifying the recipient name, address, delivery method (secure email, portal download, physical mail), and any special instructions, without visiting the registrar's office or sending an email","Integrated payment processing collects transcript fees at the time of request, with support for credit cards, debit cards, student account charges, and fee waivers for qualifying students such as current enrollees or financial hardship cases","Hold enforcement checks happen automatically at the moment of request: financial holds, library holds, disciplinary holds, and admissions holds block transcript release and display the specific reason with resolution instructions so the student can clear the hold without calling your office"]},{"id":"EO-05","name":"Grievance Management System","slug":"grievance-management-system","desc":"A centralized complaint intake, routing, and resolution system that keeps every grievance on the record from first submission through final disposition. Institutions use it to meet Title IX documentation requirements, pass HLC and regional accreditor reviews, and identify systemic issues before they become formal complaints or legal exposure.","features":[{"name":"Core Management","desc":"Essential grievance management system management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed grievance management system analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all grievance management system activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}],"details":["Every complaint receives a system-generated intake timestamp and case number at the moment it enters the system, regardless of whether it was submitted via the online portal, walked in by a student, or logged by staff from a phone call","Status transitions. Draft, Submitted, In Review, Under Investigation, Pending Decision, Resolved, Closed, Rejected, and Appealed, are recorded with the timestamp and user identity of the person who triggered the change, and these records cannot be edited or deleted after the fact","Every document upload, communication log entry, investigator note, interim measure, and outcome letter is attached to the case record with version history, so the evidentiary trail for a Title IX matter holds up to federal review without reconstruction from email chains","Routing rules map complaint categories to the correct departmental queue at submission: Title IX and sexual misconduct to the Title IX coordinator, academic integrity violations to the Dean of Students office, facilities and ADA accessibility complaints to Operations and disability services, faculty conduct matters to Academic Affairs, financial aid disputes to the financial aid appeals officer","SLA timers start at the intake timestamp and trigger automated notifications to the assigned handler at configurable intervals, a 7-day first-acknowledgment window sends alerts to the handler at day 5 and the supervisor at day 6 if no action has been logged","Escalation rules fire automatically when SLA thresholds are missed: cases with no handler action after a defined period route to the supervisor queue with a flag","Aggregate dashboards show complaint volume by category, department, college, time period, and student population segment, international students, first-generation students, students with disabilities, so administration identifies concentrations before they generate formal or external complaints","Trending analysis flags categories where complaint volume is increasing across consecutive periods, allowing student affairs and department heads to initiate proactive interventions rather than reactive investigations","Resolution rate and average time-to-resolution metrics broken down by complaint type and assigned department identify where systemic delays exist, a particular department consistently resolving cases 40% slower than the institutional average is visible in the dashboard before it becomes an accreditation finding"]},{"id":"EO-06","name":"Discussion Forums","slug":"discussion-forums","desc":"Give every course its own persistent discussion board, auto-created at enrollment and archived for future cohorts. Faculty answer a question once and all 180 students see it. Participation data is logged and exportable for accreditation documentation.","features":[{"name":"Core Management","desc":"Essential discussion forums management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed discussion forums analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all discussion forums activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}],"details":["Faculty post one answer per question; all students in the section see it immediately, a question asked by 40 students requires one response instead of 40","Students search existing threads before posting, so repeated questions decrease as the semester progresses and the archive grows","Pinned threads for syllabus questions, exam coverage, and assignment requirements absorb the highest-volume repetitive inquiries before they reach email","Participation dashboard tracks posts per student, responses given, threads started, and weeks of active engagement for every enrolled section","Export participation reports to PDF or spreadsheet and attach directly to accreditation self-study documents. No manual compilation from faculty survey anecdotes","Thread archives provide reviewers with verifiable evidence of academic discourse quality, not just satisfaction survey scores","Instructors mark exemplary threads from prior cohorts as visible to incoming students, a student in Fall 2025 can read the clearest explanation of a difficult concept posted by a Fall 2023 peer","New faculty taking over an existing course inherit a searchable record of every question prior students asked and every explanation that resolved confusion","First-generation students without established peer study groups access the same peer-generated explanations that well-connected students get through informal study networks"]},{"id":"EO-07","name":"News Portal","slug":"news-portal","desc":"Replace a tangle of departmental email newsletters and disconnected publishing tools with one institutional news portal that curates every story through a single editorial workflow, delivers content personalized by role and program, and shows you exactly which announcements students, faculty, and staff actually read. Your communications team publishes once; the portal handles the rest.","features":[{"name":"Core Management","desc":"Essential news portal management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed news portal analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all news portal activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}],"details":["Every departmental submission enters a single editorial queue managed by the communications office. No department publishes directly to the institutional news feed without editorial review and approval","Style guide enforcement at the editorial layer means every published story matches institutional brand standards regardless of which department submitted it","Story priority classification lets the editorial team distinguish a critical policy change from a routine event announcement so both appear on the portal with appropriate visual weight and placement","Content targeting uses student enrollment records, program data, academic level, cohort year, and faculty appointment records pulled directly from the SIS. No manually maintained distribution lists that fall out of date mid-semester","A student who transfers into a new program mid-year automatically starts receiving news relevant to that program because their SIS record is the source of their portal content profile, not a static email subscription","Faculty see research and policy updates, department news, and institutional governance announcements without wading through undergraduate orientation reminders or student activity news","A single approved story publishes simultaneously to the institutional news website, the email newsletter digest, the mobile app push notification feed, and the digital signage network in campus buildings, all from one publish action in the editorial interface","Channel-specific formatting rules handle the visual and length differences automatically: a full-length article on the website becomes a subject line and two-sentence preview in the email digest without anyone rewriting it","Email digest scheduling lets the communications team send a curated weekly or daily digest of the portal's most important stories rather than pushing individual emails for every published piece, reducing inbox noise while preserving reach"]},{"id":"EO-08","name":"Blog & News Management","slug":"blog-news-management","desc":"Create, manage, and publish faculty research, student stories, and institutional updates from one platform with streamlined workflows, automated author credentials, and built-in analytics to track engagement and inquiry-driven outcomes.","features":[{"name":"Core Management","desc":"Essential blog & news management management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"}],"details":["Faculty and staff submit posts through a role-appropriate authoring interface that does not require CMS training or IT-provisioned credentials. The same login they use for the faculty portal gives them access to the authoring workflow","Author bios, department affiliations, academic credentials, and headshots populate automatically from the faculty directory the moment an author is","The editorial workflow routes submitted posts to the designated communications reviewer before publication, so brand standards and factual accuracy are maintained without requiring faculty to follow a style guide they have never read","Each blog post carries attribution tracking that connects first visit through inquiry form completion, so the enrollment team sees which faculty narratives, student career stories, and departmental highlights drive qualified prospective student interest. Not just pageviews","Segment-level reporting shows which article topics convert prospective students by intended program, geographic region, and enrollment stage, so the content calendar is built on actual inquiry data rather than editorial intuition","Scheduled publishing with configurable distribution lets the enrollment team time article releases to align with recruitment calendar milestones: admitted student weekends, scholarship deadlines, open house follow-up windows","Alumni-designated blog sections publish graduate career stories in a format that connects to the alumni management module, so development officers see which donors engage with published content in the impact areas they care about most","Graduate story content contributes to giving propensity scoring when alumni engagement with specific article topics (scholarship impact, research outcomes, career trajectories) correlates with their giving history and capacity indicators","Alumni authors can submit their own career updates and professional milestones through a contributor workflow that routes submissions to the development communications team for review, turning passive donors into active contributors to the institutional narrative"]},{"id":"EO-09","name":"Notice Board & Announcements","slug":"notice-board-announcements","desc":"Publish targeted announcements to specific courses, departments, batches, faculty groups, and parent audiences with scheduled publication dates, automatic expiration, priority levels, per-student read-receipt tracking, circular management with formal numbering, and a searchable archive that proves who saw what and when.","features":[{"name":"Core Management","desc":"Essential notice board & announcements management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"}],"details":["Create notice groups by course, batch, department, role, or custom criteria, a notice to nursing students in the fall 2025 batch reaches only those 147 students, not the entire school of health sciences","Separate visibility controls for students, parents, faculty, and staff within the same notice group let you send a tuition deadline to parents of a specific course while sending the exam schedule change only to students in that course","Groups reference live enrollment data, so a student who transfers into Organic Chemistry mid-semester automatically starts receiving that course's notices without anyone editing a distribution list","The student.notice.circular.read model records a per-student read status for every notice and every circular, producing an auditable log of exactly which students viewed each communication","Acknowledgment reports show Margaret that 217 of 311 financial aid students read the FAFSA reminder, giving her office a list of the 94 who need a follow-up call before the deadline passes","Circular types classify formal communications (policy changes, regulatory notices, accreditation updates) separately from routine announcements, with their own numbering sequences for compliance documentation","Start dates and end dates on every notice control exactly when it appears and when it automatically drops off the active board. No manual takedowns, no stale notices lingering for weeks","Draft and in-progress workflow states let administrators prepare notices days or weeks in advance and publish them on schedule without logging in at 7 AM on a Monday to click a button","Academic year and academic term fields tie each notice to its institutional calendar context, so archived notices from Spring 2024 are distinct from Fall 2025 even when subjects are similar"]},{"id":"EO-10","name":"Online Appointments","slug":"online-appointments","desc":"Let students and parents book advising sessions, counseling visits, financial aid meetings, registrar appointments, and faculty office hours through a self-service calendar. Staff define availability windows, set appointment types with configurable durations, attach pre-booking intake questions, and receive automated reminders. No-show tracking, rescheduling controls, cancellation policies, walk-in queue management, and follow-up notes keep every interaction documented.","features":[{"name":"Core Management","desc":"Essential online appointments management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed online appointments analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all online appointments activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}],"details":["Students browse available slots by service type, staff member, department, or location and book in under two minutes through the student portal or mobile app without calling anyone","Pre-booking questions capture the reason for the visit, topics to discuss, any required documents, and relevant prior appointment history so staff can prepare before the student walks in","Configurable appointment types let you set different durations for advising (30 min), counseling intake (60 min), quick signature appointments (15 min), and financial aid reviews (45 min) each with their own scheduling rules","Configurable reminders fire at intervals you choose (48 hours, 24 hours, 2 hours before the appointment) via email, SMS, push notification, or in-app alert with one-click confirm or cancel links","No-show records attach to the student's appointment history so counseling directors can identify students who repeatedly miss meetings and trigger alternative outreach","Daily appointment summaries land in each staff member's inbox each morning showing their full schedule, student names, visit reasons, and any pre-submitted intake information","Staff define recurring weekly availability, one-time open slots, blocked personal time, and buffer periods between appointments in one calendar interface that all booking channels reference","Resource-based booking reserves meeting rooms, video conferencing equipment, testing stations, or lab spaces alongside the staff member's time so double-booking physical spaces becomes impossible","Staff assignment methods include round-robin distribution across team members, student choice from available staff, priority-based queuing by caseload, or manual assignment by a team leader, configured per appointment type"]},{"id":"EO-11","name":"Survey Management","slug":"survey-management","desc":"Distribute course evaluations to every enrolled student automatically at semester end using SIS enrollment data, track response rates in real time, and deliver results to department chairs within 48 hours of the collection window closing. IR teams use the same platform to run program reviews, exit surveys, first-year experience assessments, and accreditation evidence collection without separate survey tools or manual data entry.","features":[{"name":"Core Management","desc":"Essential survey management management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed survey management analytics with custom report builder and data visualization"}],"details":["Evaluation distribution generates automatically from SIS enrollment data when the semester-end trigger fires, each student receives a pre-populated evaluation for each course they are enrolled in, not a general form they must self-identify","Response rates are tracked in real time by department, program, and individual section during the collection window, so the IR team and department chairs can","Department chairs receive results within 48 hours of the collection window closing, early enough to inform course assignments and faculty development decisions for the following semester, not as an archival record that arrives too late to act on","Longitudinal analysis templates save the cross-tabulation logic for recurring accreditation evidence requests, a 3-year course evaluation trend by program and student level runs from a saved template in under 4 minutes after the initial setup","Exports generate in formats matched to HLC, SACSCOC, MSCHE, and WASC evidence documentation requirements, with date ranges, cohort definitions, and filter parameters carried through to the output file headers","Survey data from all instruments, course evaluations, program reviews, first-year experience assessments, alumni surveys, lives in the same platform, so the IR team produces a cross-instrument analysis of student outcomes without exporting between systems","Exit survey responses link to the departing student's enrollment history, academic program, GPA trajectory, and financial aid record, allowing Student Success Directors to identify whether departure correlates with academic, financial, or engagement factors rather than receiving unattached survey text","First-year experience surveys distributed at 30-day, 90-day, and semester-end intervals build a longitudinal picture of early adjustment that the advising office can act on when a student's satisfaction scores decline between the 30-day and 90-day administrations","Satisfaction surveys targeting specific student populations, transfer students, graduate students, students in online programs, international students, use the SIS demographic and enrollment data to define the target cohort without the IR team manually building an outreach list"]}]},{"name":"Connected Campus","code":"CC","slug":"connected-campus","blurb":"Connect your campus \u2014 video conferencing, messaging, social media, and third-party tools all working together smoothly.","modules":[{"id":"CC-01","name":"Moodle Integration","slug":"moodle-integration","desc":"Keep Moodle as your LMS and connect it to Alphabet's ERP layer. Sync student enrollments, fee records, and academic data automatically.","features":[],"details":[]},{"id":"CC-02","name":"BigBlueButton Integration","slug":"bigbluebutton-integration","desc":"Run a self-hosted, open-source virtual classroom on your own servers so student data never leaves campus. BigBlueButton brings education-native features \u2014 multi-user whiteboard, breakout rooms, shared notes, attendance sync \u2014 directly into your timetable and student information system.","features":[],"details":[]},{"id":"CC-03","name":"Zoom Integration","slug":"zoom-integration","desc":"Alphabet's Zoom integration automatically creates meetings from your academic timetable and syncs attendance from Zoom participation data directly into the SIS, so faculty never manually create meeting links and coordinators never chase spreadsheets to verify who attended a virtual session.","features":[],"details":[]},{"id":"CC-04","name":"WhatsApp Integration","slug":"whatsapp-integration","desc":"Send fee reminders, attendance alerts, and exam notifications to parents and students via WhatsApp Business API. Automated templates with read-receipt tracking achieve 95%+ open rates \u2014 compared to under 20% for institutional email.","features":[{"name":"Core Management","desc":"Essential whatsapp integration management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed whatsapp integration analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all whatsapp integration activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}],"details":["Fee reminders sent as WhatsApp template messages with 95%+ open rates versus under 20% for email","Attendance alerts delivered within minutes of the absence record being entered. Not in a nightly email batch","Exam schedule notifications reach parents the moment the schedule is published, with no inbox filter to clear","Late fee trigger fires when a payment due date passes without a cleared balance, sending a reminder with the outstanding amount and due date","Absence threshold trigger sends an attendance alert to the parent when a student's absence count reaches a configured limit","Exam schedule release triggers a notification to all enrolled students and registered parents when the timetable is published","Incoming parent responses are captured in the system and routed to the relevant office, finance, registrar, or academic affairs","Read receipts (sent, delivered, and read) are recorded per message and per contact, visible in the student record","Message logs are stored with timestamp and status, accessible during parent meetings, fee disputes, or attendance reviews"]},{"id":"CC-05","name":"Social Media Marketing Tool","slug":"social-media-marketing-tool","desc":"Schedule and publish across Facebook, Instagram, LinkedIn, and Twitter from one calendar, auto-capture social form leads into the enrollment CRM, track every prospect from ad click through application to enrolled student, and calculate cost-per-enrolled-student for each campaign \u2014 all within your institution's existing platform.","features":[{"name":"Core Management","desc":"Essential social media marketing tool management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed social media marketing tool analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all social media marketing tool activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}],"details":["Unified content calendar for all connected social platforms with drag-and-drop scheduling","Role-based publishing permissions so departments submit content for marketing approval before it goes live","Post templates and brand asset library enforce consistent messaging across all accounts","Facebook Lead Ads and Instagram lead forms auto-populate CRM records with campaign and ad set tagging","UTM parameters assigned at the campaign level persist through application submission and enrollment confirmation","LinkedIn inquiry forms route to the admissions pipeline rather than a monitored email address","Cross-platform performance dashboard compares organic reach, engagement rate, and lead volume by channel","Best-time-to-post analysis per platform derived from historical engagement data on your own accounts","Audience demographic insights from paid campaigns identify which segments respond to which program messaging"]},{"id":"CC-06","name":"Google Meet Integration","slug":"google-meet-integration","desc":"Automatically generate Google Meet links from your timetable, sync sessions to Google Calendar, deliver links directly to each student's portal, and record attendance from join and leave data \u2014 eliminating manual link creation and the email-chain chaos that follows.","features":[{"name":"Core Management","desc":"Essential google meet integration management capabilities"},{"name":"Student Portal","desc":"Self-service portal for students to access information"},{"name":"Basic Reporting","desc":"Standard reports and data export functionality"},{"name":"Role-Based Access","desc":"Configure user permissions and access levels"},{"name":"Advanced Analytics","desc":"Detailed google meet integration analytics with custom report builder and data visualization"},{"name":"Workflow Automation","desc":"Configure automated rules for approvals, notifications, and status transitions"},{"name":"Audit Trail","desc":"Complete audit logging of all google meet integration activities for compliance and accountability"},{"name":"Priority Support","desc":"Dedicated support team with SLA-backed response times"}],"details":["Google Meet link generates automatically when a timetable session is created. No faculty action required","Persistent link remains constant for the full term, surviving instructor changes, room reassignments, and rescheduling","Google Calendar invitations send to enrolled students at SIS-registered email addresses at session creation","Join and leave timestamps captured from Google Meet and written to the SIS attendance record after each session","Late arrivals and early departures flagged automatically based on configurable thresholds set by the institution","At-risk attendance patterns surface in the coordinator dashboard without manual report pulls","OAuth 2.0 configured once by IT in Google Cloud Console. No per-session credentials or per-faculty setup","Students access meetings through their existing Google accounts. No new logins, no separate video platform accounts","Session recordings store in Google Drive under the course's shared folder, accessible to enrolled students with inherited permissions"]},{"id":"CC-07","name":"Microsoft Teams Integration","slug":"microsoft-teams-integration","desc":"Many institutions are paying for Microsoft 365 Education E3 or A3 licenses but faculty still schedule academic sessions in Zoom or Google Meet while Teams sits unused for anything pedagogical. This integration connects your academic timetable directly to Teams \u2014 creating channels per course, scheduling meetings from the academic calendar, syncing student rosters from enrollment, and pulling attendance from meeting participation data \u2014 so the Microsoft licenses your institution is already paying for actually cover academic delivery.","features":[],"details":[]}]}]}

<script id="api-data" type="application/json">{"info":{"title":"IIWI","description":"IIWI is a mobile-first platform designed to bridge students and counselors through personalized counseling sessions and a collaborative blogging community. Students can discover verified counselors, book sessions, and engage with user-generated content, while counselors showcase their expertise via blogs and manage their professional profiles.","version":"v1"},"groups":[{"tag":"Accounts","label":"Accounts","slug":"accounts","endpoints":[{"method":"POST","path":"/update-profile","operationId":"Update Profile","summary":"Updates the user profile data.","description":"Allows a user to modify personal details such as name, contact info, or preferences stored in their profile.","parameters":[],"requestBody":{"schemaName":"UpdateProfileRequest","fields":[{"name":"gender","type":"string","required":false,"nullable":true},{"name":"firstName","type":"string","required":false,"nullable":true},{"name":"lastName","type":"string","required":false,"nullable":true},{"name":"displayName","type":"string","required":false,"nullable":true},{"name":"dob","type":"string (date-time)","required":false,"nullable":false},{"name":"address","type":"string","required":false,"nullable":true}],"example":{"gender":"female","firstName":"Jane","lastName":"Doe","displayName":"Jane Doe","dob":"2026-07-14T10:00:00Z","address":"221B Baker Street, London"}},"responses":[{"status":"200","description":"OK","schemaName":"Response","example":{"message":"Operation completed successfully."}}],"requiresAuth":true,"slug":"post-update-profile"},{"method":"POST","path":"/send-verification-email","operationId":"Send Verification Details","summary":"Sends a verification email to the user.","description":"Used to verify a user's email address during registration or when changing an email. Helps ensure the address belongs to the user.","parameters":[],"requestBody":{"schemaName":"SendVerificationEmailRequest","fields":[],"example":{}},"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"post-send-verification-email"},{"method":"GET","path":"/download-personal-data","operationId":"Download Personal Data","summary":"Exports the user's personal data.","description":"Provides a downloadable copy of the personal data the system has stored about the user, to support GDPR or similar policies.","parameters":[],"requestBody":null,"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"get-download-personal-data"},{"method":"PUT","path":"/change-email","operationId":"Change Email","summary":"Changes the user\u2019s registered email address.","description":"Updates the email address on file. May require confirmation via a verification link sent to the new address.","parameters":[],"requestBody":{"schemaName":"ChangeEmailRequest","fields":[{"name":"newEmail","type":"string (email)","required":true,"nullable":false}],"example":{"newEmail":"jane.doe@example.com"}},"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"put-change-email"},{"method":"DELETE","path":"/delete-personal-data","operationId":"Delete Personal Data","summary":"Deletes personal data associated with the account.","description":"Removes all personally identifiable information (PII) related to the user. Often used for right-to-be-forgotten compliance.","parameters":[],"requestBody":{"schemaName":"DeletePersonalDataRequest","fields":[{"name":"password","type":"string (password)","required":true,"nullable":false}],"example":{"password":"P@ssw0rd123!"}},"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"delete-delete-personal-data"},{"method":"PUT","path":"/update-phone-number","operationId":"Update Phone Number","summary":"Update phone number associated with the account.","description":"Allow user to update there phone number","parameters":[],"requestBody":{"schemaName":"UpdatePhoneNumberRequest","fields":[{"name":"phoneNumber","type":"string (tel)","required":true,"nullable":false}],"example":{"phoneNumber":"+1 202-555-0176"}},"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"put-update-phone-number"}]},{"tag":"Authentication","label":"Authentication","slug":"authentication","endpoints":[{"method":"GET","path":"/load-key","operationId":"Load Key and QR Code URI","summary":"Returns the key and QR code URI for setting up authenticator apps.","description":"Used during 2FA setup to get the secret key and QR code URI required for apps like Google Authenticator.","parameters":[],"requestBody":null,"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"get-load-key"},{"method":"POST","path":"/enable-authenticator","operationId":"Enable Authenticator","summary":"Enables two-factor authentication for the current user.","description":"Verifies a code from the authenticator app and enables 2FA for the user's account.","parameters":[],"requestBody":{"schemaName":"EnableAuthenticatorRequest","fields":[{"name":"code","type":"string (string)","required":true,"nullable":false}],"example":{"code":"123456"}},"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"post-enable-authenticator"},{"method":"GET","path":"/external-logins","operationId":"External Logins","summary":"Lists external login providers linked to the user account.","description":"Returns a list of OAuth-based logins (e.g., Google, Facebook) associated with the user.","parameters":[],"requestBody":null,"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"get-external-logins"},{"method":"DELETE","path":"/remove-login","operationId":"Remove Login","summary":"Removes a linked external login from the user account.","description":"Unlinks an external provider from the user's account.","parameters":[],"requestBody":{"schemaName":"RemoveLoginRequest","fields":[{"name":"loginProvider","type":"string","required":false,"nullable":true},{"name":"providerKey","type":"string","required":false,"nullable":true}],"example":{"loginProvider":"string","providerKey":"string"}},"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"delete-remove-login"},{"method":"POST","path":"/link-login","operationId":"Link External Login","summary":"Initiates the linking of an external login provider.","description":"Redirects to the provider's auth page to link a new login to the user account.","parameters":[],"requestBody":{"schemaName":"LinkLoginRequest","fields":[{"name":"provider","type":"string","required":true,"nullable":false}],"example":{"provider":"string"}},"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"post-link-login"},{"method":"GET","path":"/link-login-callback","operationId":"Link Login Callback","summary":"Callback endpoint for external login linking.","description":"Finalizes the linking of an external login after successful authentication.","parameters":[],"requestBody":null,"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"get-link-login-callback"},{"method":"POST","path":"/generate-recovery-codes","operationId":"Generate Recovery Codes","summary":"Generates backup codes for 2FA recovery.","description":"Provides a list of single-use recovery codes to regain access if 2FA is lost. Should be stored securely.","parameters":[],"requestBody":null,"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"post-generate-recovery-codes"},{"method":"POST","path":"/reset-authenticator","operationId":"Reset Authenticator","summary":"Resets the authenticator key for 2FA.","description":"Disables 2FA and clears the old key. Use this if changing devices or switching to a different app.","parameters":[],"requestBody":null,"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"post-reset-authenticator"},{"method":"POST","path":"/set-password","operationId":"Set Password","summary":"Sets a new password for the user.","description":"Allows password creation for accounts created via external login methods.","parameters":[],"requestBody":{"schemaName":"SetPasswordRequest","fields":[{"name":"newPassword","type":"string (password)","required":true,"nullable":false},{"name":"confirmPassword","type":"string (password)","required":false,"nullable":true}],"example":{"newPassword":"P@ssw0rd123!","confirmPassword":"P@ssw0rd123!"}},"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"post-set-password"},{"method":"POST","path":"/change-password","operationId":"Change Password","summary":"Changes the user\u2019s password.","description":"Lets the user update their account password. Typically used after login, or during a security update.","parameters":[],"requestBody":{"schemaName":"ChangePasswordRequest","fields":[{"name":"oldPassword","type":"string (password)","required":true,"nullable":false},{"name":"newPassword","type":"string (password)","required":true,"nullable":false},{"name":"confirmPassword","type":"string (password)","required":false,"nullable":true}],"example":{"oldPassword":"P@ssw0rd123!","newPassword":"P@ssw0rd123!","confirmPassword":"P@ssw0rd123!"}},"responses":[{"status":"200","description":"OK","schemaName":null,"example":null}],"requiresAuth":true,"slug":"post-change-password"},{"method":"POST","path":"/account-status","operationId":"Account Status","summary":"Returns the current authentication status of the account.","description":"Indicates whether 2FA is enabled, external logins exist, and other auth d <script>(function(){
  const DATA = JSON.parse(document.getElementById('alphabet-data').textContent);
  const CATS = DATA.categories;
  const API = JSON.parse(document.getElementById('api-data').textContent);

  const ALL_ENDPOINTS = [];
  API.groups.forEach(g => {
    g.endpoints.forEach(e => {
      ALL_ENDPOINTS.push({ ...e, groupLabel: g.label, groupSlug: g.slug });
    });
  });
  const endpointBySlug = {};
  ALL_ENDPOINTS.forEach(e => endpointBySlug[e.slug] = e);

  // ---------- Icon set (hand-drawn, stroke-based, 24x24 viewBox) ----------
  const ICON_PATHS = {
    "student-success": '<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12.5V17c0 1.8 2.7 3.5 6 3.5s6-1.7 6-3.5v-4.5"/><path d="M22 10v6"/>',
    "daily-operations": '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/>',
    "teaching-learning": '<path d="M12 6.5c-1.8-1.3-4.4-2-7-2-1 0-2 .1-3 .4v13c1-.3 2-.4 3-.4 2.6 0 5.2.7 7 2 1.8-1.3 4.4-2 7-2 1 0 2 .1 3 .4v-13c-1-.3-2-.4-3-.4-2.6 0-5.2.7-7 2Z"/><path d="M12 6.5V20"/>',
    "strategic-capabilities": '<path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/>',
    "finance-administration": '<path d="M12 1.5v21"/><path d="M17 5.5H9.2a3.7 3.7 0 0 0 0 7.4h5.6a3.7 3.7 0 0 1 0 7.4H6"/>',
    "campus-operations": '<path d="M6 21V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v17"/><path d="M14 10h5a1 1 0 0 1 1 1v10"/><path d="M2 21h20"/><path d="M9 7h.01M9 11h.01M9 15h.01M9 18h.01"/>',
    "engagement-outreach": '<path d="m3 10 17-5v13L3 15v-5Z"/><path d="M7 15v4a2 2 0 0 0 4 0v-3"/>',
    "connected-campus": '<circle cx="18" cy="5.5" r="2.8"/><circle cx="6" cy="12" r="2.8"/><circle cx="18" cy="18.5" r="2.8"/><path d="m8.4 10.5 7.2-3.6M8.4 13.5l7.2 3.6"/>',
  };
  function icon(catSlug, size){
    const p = ICON_PATHS[catSlug] || ICON_PATHS['strategic-capabilities'];
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  }
  function catIcon(catSlug, sizeClass){
    return `<span class="cat-icon ${sizeClass}">${icon(catSlug)}</span>`;
  }

  // Flatten module index for search / prev-next
  const ALL_MODULES = [];
  CATS.forEach(cat => {
    cat.modules.forEach(m => {
      ALL_MODULES.push({ ...m, catName: cat.name, catSlug: cat.slug, catCode: cat.code });
    });
  });

  const bySlug = {};
  ALL_MODULES.forEach(m => bySlug[m.slug] = m);

  const navSections = document.getElementById('navSections');
  const navApiSections = document.getElementById('navApiSections');
  const content = document.getElementById('content');
  const breadcrumb = document.getElementById('breadcrumb');
  const navHome = document.getElementById('navHome');
  const navApiHome = document.getElementById('navApiHome');

  // ---------- Build sidebar ----------
  function buildSidebar(){
    navSections.innerHTML = '';
    CATS.forEach(cat => {
      const section = document.createElement('div');
      section.className = 'nav-section';
      section.dataset.cat = cat.slug;

      const btn = document.createElement('button');
      btn.className = 'nav-cat-btn';
      btn.innerHTML = `
        <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 18 6-6-6-6"/></svg>
        ${catIcon(cat.slug, 'sm')}
        <span class="cat-code">${cat.code}</span>
        <span>${cat.name}</span>
        <span class="cat-count">${cat.modules.length}</span>
      `;
      btn.addEventListener('click', () => {
        section.classList.toggle('open');
      });

      const modsWrap = document.createElement('div');
      modsWrap.className = 'nav-mods';
      cat.modules.forEach(mod => {
        const a = document.createElement('a');
        a.className = 'nav-mod-link';
        a.href = `#/module/${mod.slug}`;
        a.dataset.slug = mod.slug;
        a.innerHTML = `<span class="mod-id">${mod.id}</span><span>${mod.name}</span>`;
        modsWrap.appendChild(a);
      });

      section.appendChild(btn);
      section.appendChild(modsWrap);
      navSections.appendChild(section);
    });
  }

  // ---------- Build API sidebar ----------
  function buildApiSidebar(){
    navApiSections.innerHTML = '';
    const section = document.createElement('div');
    section.className = 'nav-section';
    section.dataset.apiSection = 'true';

    const btn = document.createElement('button');
    btn.className = 'nav-cat-btn';
    btn.innerHTML = `
      <svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 18 6-6-6-6"/></svg>
      <span class="cat-code">${ALL_ENDPOINTS.length}</span>
      <span>All endpoints</span>
    `;
    btn.addEventListener('click', () => section.classList.toggle('open'));

    const wrap = document.createElement('div');
    wrap.className = 'nav-mods';
    API.groups.forEach(g => {
      const label = document.createElement('div');
      label.className = 'api-group-label';
      label.textContent = g.label;
      wrap.appendChild(label);
      g.endpoints.forEach(ep => {
        const a = document.createElement('a');
        a.className = 'nav-endpoint-link';
        a.href = `#/api/endpoint/${ep.slug}`;
        a.dataset.epSlug = ep.slug;
        a.innerHTML = `<span class="method-badge ${ep.method.toLowerCase()}">${ep.method}</span><span class="ep-path">${ep.path}</span>`;
        wrap.appendChild(a);
      });
    });

    section.appendChild(btn);
    section.appendChild(wrap);
    navApiSections.appendChild(section);
  }

  function setActiveNav(slug){
    document.querySelectorAll('.nav-mod-link').forEach(a => {
      a.classList.toggle('active', a.dataset.slug === slug);
    });
    document.querySelectorAll('.nav-endpoint-link').forEach(a => a.classList.remove('active'));
    navHome.classList.toggle('active', !slug);
    navApiHome.classList.remove('active');
    if (slug){
      const mod = bySlug[slug];
      if (mod){
        const section = navSections.querySelector(`.nav-section[data-cat="${mod.catSlug}"]`);
        if (section) section.classList.add('open');
      }
    }
  }

  function setActiveApiEndpoint(slug){
    document.querySelectorAll('.nav-mod-link').forEach(a => a.classList.remove('active'));
    document.querySelectorAll('.nav-endpoint-link').forEach(a => {
      a.classList.toggle('active', a.dataset.epSlug === slug);
    });
    navHome.classList.remove('active');
    navApiHome.classList.toggle('active', !slug);
    const section = navApiSections.querySelector('.nav-section');
    if (section) section.classList.add('open');
  }
